name: Actualizar reservas

# Cada noche a las 23:59 (hora de Córdoba). GitHub usa hora UTC, así que hay dos
# programaciones (horario de verano e invierno) y solo se ejecuta la que corresponde.
on:
  schedule:
    - cron: "59 21 * * *"   # 23:59 en horario de verano (UTC+2)
    - cron: "59 22 * * *"   # 23:59 en horario de invierno (UTC+1)
  workflow_dispatch:         # botón «Run workflow» para actualizar a mano
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-reservas
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      seguir: ${{ steps.hora.outputs.seguir }}
    steps:
      - name: ¿Toca ejecutar ahora?
        id: hora
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "seguir=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          OFFSET=$(TZ=Europe/Madrid date +%z)   # +0200 en verano, +0100 en invierno
          if { [ "${{ github.event.schedule }}" = "59 21 * * *" ] && [ "$OFFSET" = "+0200" ]; } || \
             { [ "${{ github.event.schedule }}" = "59 22 * * *" ] && [ "$OFFSET" = "+0100" ]; }; then
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          else
            echo "seguir=no" >> "$GITHUB_OUTPUT"; echo "No es la programación de esta época del año."
          fi

      - uses: actions/checkout@v4
        if: steps.hora.outputs.seguir == 'si'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.seguir == 'si'
        with:
          python-version: "3.12"

      - name: Consultar SRA y generar la web
        if: steps.hora.outputs.seguir == 'si'
        run: python generar_web.py

      - name: Guardar el historial (para detectar cambios mañana)
        if: steps.hora.outputs.seguir == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Datos SRA $(TZ=Europe/Madrid date +%Y-%m-%d)" || echo "Sin cambios en los datos"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.hora.outputs.seguir == 'si'
        with:
          path: sitio

  publicar:
    needs: generar
    if: needs.generar.outputs.seguir == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
